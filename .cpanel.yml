---
deployment:
  tasks:
    - export DEPLOYPATH=/home/mrtradex/public_html/panel.mrtradex.ie/
    - /bin/cp -R app $DEPLOYPATH
    - /bin/cp -R bootstrap $DEPLOYPATH
    - /bin/cp -R config $DEPLOYPATH
    - /bin/cp -R database $DEPLOYPATH
    - /bin/cp -R lang $DEPLOYPATH
    - /bin/cp -R public $DEPLOYPATH
    - /bin/rm -f $DEPLOYPATH/public/_install.php $DEPLOYPATH/public/_migrate.php $DEPLOYPATH/public/phpver.php
    - /bin/cp -R resources $DEPLOYPATH
    - /bin/cp -R routes $DEPLOYPATH
    - /bin/cp artisan $DEPLOYPATH
    - /bin/cp composer.json $DEPLOYPATH
    - /bin/cp composer.lock $DEPLOYPATH
    - /bin/cp package.json $DEPLOYPATH
    - /bin/cp tailwind.config.js $DEPLOYPATH
    - /bin/cp postcss.config.js $DEPLOYPATH
    - /bin/cp vite.config.js $DEPLOYPATH
    - /bin/rm -f $DEPLOYPATH/bootstrap/cache/*.php
    - cd $DEPLOYPATH && /usr/local/bin/ea-php83 artisan migrate --force --no-interaction 2>&1 || /usr/local/bin/php artisan migrate --force --no-interaction 2>&1 || /bin/echo "Migracja pominięta (php artisan niedostępny)"
    - /bin/echo "Deploy zakończony - cache wyczyszczony + migracje wykonane"
